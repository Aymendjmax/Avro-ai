<style>:root{--pb:#0d0d0e;--pf:#f2f2f3;--pm:#8d8d93;--pc:#1a1a1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.er{margin:0 12px 14px;padding:10px 14px;border-radius:14px;border:1px solid var(--er);color:var(--er);font-size:13px}
.sg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.sg div{border-radius:12px;padding:10px;font-size:12px;border:1px solid #8883}.sg code{display:block;opacity:.85;margin-top:2px;direction:ltr;text-align:right}</style></head><body><div class="w">
